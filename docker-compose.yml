name: auto-msg-backend
# Local dependencies. The app runs from the IDE/mvnw; to also run the app in a container:
#   docker compose --profile app up --build
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: conversa-postgres
    environment:
      POSTGRES_DB: conversa
      POSTGRES_USER: conversa
      POSTGRES_PASSWORD: conversa
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conversa -d conversa"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    container_name: conversa-app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/conversa
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
    ports:
      - "${SERVER_PORT:-8081}:8080"

volumes:
  postgres-data:
