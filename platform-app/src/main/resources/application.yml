spring:
  application:
    name: conversa
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/conversa}
    username: ${DB_USER:conversa}
    password: ${DB_PASSWORD:conversa}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  servlet:
    session:
      timeout: 12h
      cookie:
        name: CONVERSA_SESSION
        http-only: true
        same-site: lax
        # true behind HTTPS (production); false only for local development over http
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

conversa:
  whatsapp:
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    graph-api-url: ${WHATSAPP_GRAPH_API_URL:https://graph.facebook.com}
    graph-api-version: ${WHATSAPP_GRAPH_API_VERSION:v24.0}
  llm:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      default-model: ${ANTHROPIC_DEFAULT_MODEL:claude-opus-5-5}
    # USD per million tokens (Anthropic list prices, 2026-10). Cache writes use the 5-minute rate
    # (1.25x input). Haiku 5.5 cache read assumes the usual 0.1x input. Update when prices change.
    prices:
      claude-opus-5-5: { input: 4.00, output: 20.00, cache-read: 0.20, cache-write: 5.00 }
      claude-sonnet-5-5: { input: 2.00, output: 10.00, cache-read: 0.20, cache-write: 2.50 }
      claude-haiku-5-5: { input: 0.10, output: 0.50, cache-read: 0.01, cache-write: 0.125 }
      claude-opus-5: { input: 5.00, output: 25.00, cache-read: 0.50, cache-write: 6.25 }
      claude-opus-4-8: { input: 5.00, output: 25.00, cache-read: 0.50, cache-write: 6.25 }
  assistant:
    enabled: ${ASSISTANT_ENABLED:true}
    default-effort: ${ASSISTANT_EFFORT:low}
  handoff:
    staff-alert-template: ${HANDOFF_STAFF_ALERT_TEMPLATE:}
    staff-alert-language: ${HANDOFF_STAFF_ALERT_LANGUAGE:pt_BR}
  orders:
    staff-alert-template: ${ORDERS_STAFF_ALERT_TEMPLATE:}
    staff-alert-language: ${ORDERS_STAFF_ALERT_LANGUAGE:pt_BR}
    # Templates for status notices when the 24h window is closed ({{1}} = order number)
    status-templates:
      PREPARING: ${ORDERS_TEMPLATE_PREPARING:}
      OUT_FOR_DELIVERY: ${ORDERS_TEMPLATE_OUT_FOR_DELIVERY:}
      READY_FOR_PICKUP: ${ORDERS_TEMPLATE_READY_FOR_PICKUP:}
      COMPLETED: ${ORDERS_TEMPLATE_COMPLETED:}
      CANCELLED: ${ORDERS_TEMPLATE_CANCELLED:}
  workers:
    enabled: ${WORKERS_ENABLED:true}
  bootstrap:
    slug: ${BOOTSTRAP_TENANT_SLUG:}
    display-name: ${BOOTSTRAP_TENANT_NAME:}
    segment: ${BOOTSTRAP_TENANT_SEGMENT:restaurant}
    config-json: ${BOOTSTRAP_TENANT_CONFIG:}
    phone-number-id: ${BOOTSTRAP_PHONE_NUMBER_ID:}
    waba-id: ${BOOTSTRAP_WABA_ID:}
    access-token-ref: ${BOOTSTRAP_ACCESS_TOKEN_REF:}
    data-dir: ${BOOTSTRAP_DATA_DIR:}
    staff-email: ${BOOTSTRAP_STAFF_EMAIL:}
    staff-name: ${BOOTSTRAP_STAFF_NAME:Equipe}
    staff-password: ${BOOTSTRAP_STAFF_PASSWORD:}
