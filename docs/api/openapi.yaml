openapi: 3.1.0
info:
  title: Conversa panel API
  version: 1.0.0
  description: |
    REST + SSE API of the staff panel (ADR-009, D-010). Same origin as the panel: the browser keeps
    the session in the HttpOnly cookie `CONVERSA_SESSION`. Every state-changing request sends the
    value of the `XSRF-TOKEN` cookie in the `X-XSRF-TOKEN` header; call `GET /api/v1/auth/csrf`
    first to get the cookie. All data belongs to the signed-in staff member's business.
servers:
  - url: /
paths:
  /api/v1/auth/csrf:
    get:
      summary: Issues the CSRF cookie
      security: []
      responses:
        '200':
          description: Cookie `XSRF-TOKEN` set
          content:
            application/json:
              schema:
                type: object
                properties:
                  headerName: { type: string, example: X-XSRF-TOKEN }
  /api/v1/auth/login:
    post:
      summary: Signs in with e-mail and password
      security: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Signed in; session cookie set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401':
          description: Wrong e-mail or password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { description: Missing CSRF token }
  /api/v1/auth/me:
    get:
      summary: The signed-in staff member
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
          description: Signed in
        '401': { description: Not signed in }
  /api/v1/auth/logout:
    post:
      summary: Signs out
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204': { description: Signed out }
  /api/v1/orders:
    get:
      summary: Orders of the board
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [open, recent], default: open }
          description: '`open`: orders in progress; `recent`: every order of the last 24 hours'
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
        '401': { description: Not signed in }
  /api/v1/orders/{id}:
    get:
      summary: One order
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
          description: The order
        '404': { description: Not an order of this business }
  /api/v1/orders/{id}/status:
    post:
      summary: Moves the order; the customer is notified on WhatsApp (D-011)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
          description: Moved
        '404': { description: Not an order of this business }
        '409':
          description: |
            Not allowed from the current status. RECEIVED → PREPARING, OUT_FOR_DELIVERY,
            READY_FOR_PICKUP, CANCELLED; PREPARING → OUT_FOR_DELIVERY, READY_FOR_PICKUP, CANCELLED;
            OUT_FOR_DELIVERY / READY_FOR_PICKUP → COMPLETED, CANCELLED. OUT_FOR_DELIVERY only for
            delivery orders, READY_FOR_PICKUP only for pickup orders.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/conversations:
    get:
      summary: Latest conversations (simulator excluded)
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [BOT, HUMAN] } }
        - { name: q, in: query, description: Part of the customer name or phone, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Most recent message first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConversationSummary' }
  /api/v1/conversations/{id}:
    get:
      summary: A conversation with its latest 100 messages and the pack state (e.g. the cart)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationDetail' }
          description: The conversation
        '404': { description: No such conversation for this business }
  /api/v1/conversations/handoffs:
    get:
      summary: Conversations staff are handling now (the bot is paused)
      responses:
        '200':
          description: Most recent handoff first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Handoff' }
  /api/v1/conversations/{id}/takeover:
    post:
      summary: Staff take the conversation over; the bot stops until it is handed back
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204': { description: The bot is paused for this customer }
        '404': { description: No such conversation for this business }
  /api/v1/conversations/{id}/resume:
    post:
      summary: Hands the conversation back to the bot
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204': { description: The bot is back; a customer left waiting is answered now }
  /api/v1/settings:
    get:
      summary: The business settings (published, draft, effective, defaults, schema and versions)
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
          description: Settings
  /api/v1/settings/draft:
    put:
      summary: Replaces the draft with the business own settings (admins only)
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Validated against the pack schema after merging with the defaults }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Saved' }
          description: Draft saved
        '403': { description: Not an admin }
        '422':
          description: Invalid settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  details: { type: array, items: { type: string } }
  /api/v1/settings/publish:
    post:
      summary: Makes the draft what WhatsApp uses (admins only)
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Saved' }
          description: Published version
        '403': { description: Not an admin }
        '409':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
          description: No draft to publish
  /api/v1/simulator/messages:
    get:
      summary: The admin simulated conversation so far
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SimulatorLine' }
          description: Oldest first
    post:
      summary: Says something to the assistant as a customer, with the draft settings (admins only)
      description: |
        Real model and tools, nothing sent to WhatsApp, no order created. The answer carries the
        human pace: show "digitando..." at each `typingAtMs` and each bubble at its `atMs`
        (milliseconds after the customer message).
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, maxLength: 4096 }
                replyId: { type: string, description: Id of the tapped button or list row }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulatorReply' }
          description: The assistant answer
        '403': { description: Not an admin }
    delete:
      summary: Starts the simulated conversation over
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204': { description: Forgotten }
  /api/v1/events:
    get:
      summary: Live events (Server-Sent Events)
      description: |
        `event: ready` when connected, then `order.created`, `order.updated`,
        `conversation.handoff` and `conversation.resumed`, each with data
        `{"type": "...", "id": "<uuid>"}`; the panel refetches what the event names. Comment
        lines (`: ping`) every 25 s keep the connection open.
      responses:
        '200':
          content:
            text/event-stream:
              schema: { type: string }
          description: Event stream
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Csrf:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema: { type: string }
      description: Value of the `XSRF-TOKEN` cookie
  schemas:
    Me:
      type: object
      properties:
        email: { type: string }
        name: { type: string }
        tenantId: { type: string, format: uuid }
        role: { type: string, enum: [ADMIN, STAFF], description: Admins edit settings and use the simulator }
    Error:
      type: object
      properties:
        error: { type: string }
    OrderStatus:
      type: string
      enum: [RECEIVED, PREPARING, OUT_FOR_DELIVERY, READY_FOR_PICKUP, COMPLETED, CANCELLED]
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, description: 'Shown as #number' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        customerName: { type: [string, 'null'], description: Name on WhatsApp }
        customerPhone: { type: string, description: 'WhatsApp number with country code, e.g. 5516990000001' }
        fulfillment: { type: string, enum: [DELIVERY, PICKUP] }
        address: { type: [string, 'null'] }
        neighborhood: { type: [string, 'null'] }
        deliveryFee: { type: number }
        paymentMethod: { type: string, enum: [cash, card_on_delivery, pix_on_delivery] }
        changeFor: { type: [number, 'null'], description: Cash the customer pays with }
        subtotal: { type: number }
        total: { type: number }
        items:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              quantity: { type: integer }
              unitPrice: { type: number }
              options: { type: array, items: { type: string }, example: ['Tamanho: Grande'] }
              notes: { type: [string, 'null'] }
              lineTotal: { type: number }
    Handoff:
      type: object
      properties:
        id: { type: string, format: uuid }
        customerName: { type: [string, 'null'] }
        customerPhone: { type: string }
        handoffReason: { type: string, enum: [STAFF_REPLY, STAFF_TAKEOVER, CUSTOMER_REQUEST, BOT_REQUEST, REPEATED_FAILURES] }
        handoffAt: { type: string, format: date-time }
        pausedUntil: { type: string, format: date-time }
        lastMessage: { type: [string, 'null'] }
    ConversationSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        customerName: { type: [string, 'null'] }
        customerPhone: { type: string }
        state: { type: string, enum: [BOT, HUMAN] }
        handoffReason: { type: [string, 'null'] }
        pausedUntil: { type: [string, 'null'], format: date-time }
        lastMessage: { type: [string, 'null'] }
        lastAuthor: { type: [string, 'null'], enum: [CUSTOMER, BOT, STAFF, null] }
        lastMessageAt: { type: [string, 'null'], format: date-time }
    ConversationDetail:
      type: object
      properties:
        conversation: { $ref: '#/components/schemas/ConversationSummary' }
        messages:
          type: array
          items:
            type: object
            properties:
              direction: { type: string, enum: [IN, OUT] }
              author: { type: string, enum: [CUSTOMER, BOT, STAFF] }
              text: { type: string }
              sentAt: { type: string, format: date-time }
        state: { type: object, description: 'The pack conversation state, e.g. {"cart": {...}}' }
    Settings:
      type: object
      properties:
        published: { type: object }
        draft: { type: [object, 'null'] }
        effective: { type: object }
        defaults: { type: object }
        schema: { type: object }
        versions:
          type: array
          items:
            type: object
            properties:
              version: { type: integer }
              status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
              createdAt: { type: string, format: date-time }
              publishedAt: { type: [string, 'null'], format: date-time }
    Saved:
      type: object
      properties:
        version: { type: integer }
    SimulatorLine:
      type: object
      properties:
        author: { type: string, enum: [CUSTOMER, BOT] }
        text: { type: string }
        sentAt: { type: string, format: date-time }
    SimulatorReply:
      type: object
      properties:
        outcome: { type: string, enum: [ANSWERED, CHECKOUT, HANDOFF, REFUSED, FALLBACK, CONFIRMED] }
        toolsCalled: { type: array, items: { type: string } }
        typingAtMs: { type: array, items: { type: integer } }
        bubbles:
          type: array
          items:
            type: object
            properties:
              text: { type: string }
              atMs: { type: integer }
              asButtons: { type: boolean }
              choices:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    title: { type: string }
