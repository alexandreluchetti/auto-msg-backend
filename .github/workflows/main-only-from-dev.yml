# Required status check of the main ruleset: main (production) only accepts
# pull requests coming from dev.
name: Main only from dev

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  source-branch:
    name: source-branch-is-dev
    runs-on: ubuntu-latest
    steps:
      - name: Only dev can be merged into main
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Pull requests into main must come from dev of this repository (got $HEAD_REPO:$HEAD_REF)."
            exit 1
          fi
          echo "OK: dev -> main"
